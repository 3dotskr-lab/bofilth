];

/* ====================== 초기화 ====================== */
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const grid = document.getElementById("grid");

/* 초록집 허용 확장자 <-> MIME (양방향 1:1) */
const ABSTRACT_MIME = {
  pdf:  "application/pdf",
  doc:  "application/msword",
  docx: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
  ppt:  "application/vnd.ms-powerpoint",
  pptx: "application/vnd.openxmlformats-officedocument.presentationml.presentation",
  zip:  "application/zip",
};
const MIME_TO_EXT = Object.fromEntries(
  Object.entries(ABSTRACT_MIME).map(([ext, mime]) => [mime, ext])
);
const ABSTRACT_ACCEPT = ".pdf,.doc,.docx,.ppt,.pptx,.zip";
const MAX_ABSTRACT_MB = 50;

/* 초록집은 확장자 없는 고정 키에 저장한다.
   덮어쓰기 시 항상 같은 키라 이전 파일이 남지 않으며,
   실제 확장자는 저장된 mimetype 으로 복원한다. */
function photoPath(id){ return `photos/${id}.jpg`; }
function abstractPath(id){ return `abstracts/${id}`; }

function publicUrl(id, v){
  const { data } = sb.storage.from(BUCKET).getPublicUrl(photoPath(id));
  return data.publicUrl + (v ? `?v=${v}` : "");
}
function abstractUrl(id, v){
  const { data } = sb.storage.from(BUCKET).getPublicUrl(abstractPath(id));
  return data.publicUrl + (v ? `?v=${v}` : "");
}

/* abstracts 폴더를 조회해서 id -> {ext, filename} 맵을 만든다.
   filename 은 업로드 시 저장해둔 커스텀 메타데이터(originalName)에서 가져온다. */
async function fetchAbstractMap(){
  const map = {};
  try{
    const { data, error } = await sb.storage.from(BUCKET).list("abstracts", { limit: 1000 });
    if(error) throw error;
    const entries = (data || [])
      .map(o => ({ name: o.name, ext: MIME_TO_EXT[o.metadata && o.metadata.mimetype] }))
      .filter(o => o.ext);

    await Promise.all(entries.map(async (o) => {
      let filename = `초록집.${o.ext}`;
      try{
        const { data: info } = await sb.storage.from(BUCKET).info(abstractPath(o.name));
        if(info && info.metadata && info.metadata.originalName){
          filename = info.metadata.originalName;
        }
      }catch(_){ /* 파일명 조회 실패 시 기본값 사용 */ }
      map[o.name] = { ext: o.ext, filename };
    }));
  }catch(err){
    console.error("초록집 목록 조회 실패", err);
  }
  return map;
}

function setPhotoRegistered(id){
  const b = document.getElementById(`pbadge-${id}`);
  b.textContent = "사진 등록됨";
  b.classList.add("done");
  const l = document.getElementById(`label-${id}`);
  l.textContent = "사진 수정";
  l.classList.add("has-photo");
  l.appendChild(photoInputFor(id));
}

function setAbstractRegistered(id, filename){
  const b = document.getElementById(`abadge-${id}`);
  b.textContent = "초록집 등록됨";
  b.classList.add("done");
  const l = document.getElementById(`alabel-${id}`);
  l.textContent = "초록집 수정";
  l.classList.add("has-photo");
  l.appendChild(abstractInputFor(id));
  const f = document.getElementById(`afile-${id}`);
  f.textContent = filename;
  f.title = filename;
  document.getElementById(`adel-${id}`).hidden = false;
}

function setAbstractUnregistered(id){
  const b = document.getElementById(`abadge-${id}`);
  b.textContent = "초록집 미등록";
  b.classList.remove("done");
  const l = document.getElementById(`alabel-${id}`);
  l.textContent = "초록집 등록";
  l.classList.remove("has-photo");
  l.appendChild(abstractInputFor(id));
  const f = document.getElementById(`afile-${id}`);
  f.textContent = "";
  f.title = "";
  document.getElementById(`adel-${id}`).hidden = true;
}

async function renderCards(){
  grid.innerHTML = "";
  SPEAKERS.forEach(sp => {
    const card = document.createElement("div");
    card.className = "card";
    card.id = `card-${sp.id}`;
    card.innerHTML = `
      <div class="badges">
        <span class="badge" id="pbadge-${sp.id}">사진 미등록</span>
        <span class="badge" id="abadge-${sp.id}">초록집 미등록</span>
      </div>
      <div class="photo-wrap" id="photo-${sp.id}">
        <span class="placeholder">사진 없음</span>
      </div>
      <div class="name">${sp.name}</div>
      <div class="aff">${sp.aff || ""}</div>
      <label class="upload-label" id="label-${sp.id}">사진 등록
        <input type="file" accept="image/*" data-id="${sp.id}" data-kind="photo">
      </label>
      <div class="abstract-row">
        <label class="upload-label abstract" id="alabel-${sp.id}">초록집 등록
          <input type="file" accept="${ABSTRACT_ACCEPT}" data-id="${sp.id}" data-kind="abstract">
        </label>
        <button type="button" class="del-btn" id="adel-${sp.id}" data-id="${sp.id}" title="초록집 삭제" hidden>✕</button>
      </div>
      <div class="abstract-filename" id="afile-${sp.id}"></div>
      <div class="status" id="status-${sp.id}"></div>
    `;
    grid.appendChild(card);

    const img = new Image();
    img.onload = () => {
      const wrap = document.getElementById(`photo-${sp.id}`);
      wrap.innerHTML = "";
      wrap.appendChild(img);
      setPhotoRegistered(sp.id);
    };
    img.onerror = () => { /* 사진 없음 상태 유지 */ };
    img.src = publicUrl(sp.id, Date.now());
    img.alt = sp.name;
  });

  grid.querySelectorAll('input[type=file]').forEach(inp => {
    inp.addEventListener("change", onFileSelected);
  });

  const amap = await fetchAbstractMap();
  SPEAKERS.forEach(sp => {
    if(amap[sp.id]) setAbstractRegistered(sp.id, amap[sp.id].filename);
  });
}

grid.addEventListener("click", (e) => {
  const btn = e.target.closest(".del-btn");
  if(!btn) return;
  deleteAbstract(btn.dataset.id);
});

function makeInput(id, kind, accept){
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = accept;
  inp.dataset.id = id;
  inp.dataset.kind = kind;
  inp.addEventListener("change", onFileSelected);
  return inp;
}
function photoInputFor(id){ return makeInput(id, "photo", "image/*"); }
function abstractInputFor(id){ return makeInput(id, "abstract", ABSTRACT_ACCEPT); }

async function onFileSelected(e){
  const file = e.target.files[0];
  const id = e.target.dataset.id;
  const kind = e.target.dataset.kind;
  if(!file) return;
  const statusEl = document.getElementById(`status-${id}`);
  statusEl.className = "status busy";
  statusEl.textContent = "업로드 중...";

  try{
    if(kind === "abstract"){
      await uploadAbstract(id, file);
    }else{
      await uploadPhoto(id, file);
    }
    statusEl.className = "status ok";
    statusEl.textContent = "등록 완료!";
    setTimeout(() => { statusEl.textContent = ""; }, 2500);
  }catch(err){
    console.error(err);
    statusEl.className = "status err";
    statusEl.textContent = "업로드 실패: " + (err.message || err);
  }finally{
    e.target.value = "";
  }
}

async function uploadPhoto(id, file){
  const blob = await resizeToJpeg(file, 800, 0.85);
  const { error } = await sb.storage.from(BUCKET).upload(photoPath(id), blob, {
    upsert: true,
    contentType: "image/jpeg",
    cacheControl: "3600",
  });
  if(error) throw error;

  const wrap = document.getElementById(`photo-${id}`);
  wrap.innerHTML = "";
  const img = document.createElement("img");
  img.src = publicUrl(id, Date.now());
  wrap.appendChild(img);
  setPhotoRegistered(id);
}

async function uploadAbstract(id, file){
  const ext = (file.name.split(".").pop() || "").toLowerCase();
  const mime = ABSTRACT_MIME[ext];
  if(!mime){
    throw new Error("ppt, pptx, doc, docx, pdf, zip 파일만 등록할 수 있습니다");
  }
  if(file.size > MAX_ABSTRACT_MB * 1024 * 1024){
    throw new Error(`파일이 너무 큽니다 (최대 ${MAX_ABSTRACT_MB}MB)`);
  }
  const { error } = await sb.storage.from(BUCKET).upload(abstractPath(id), file, {
    upsert: true,
    contentType: mime,
    cacheControl: "no-cache",
    metadata: { originalName: file.name },
  });
  if(error) throw error;
  setAbstractRegistered(id, file.name);
}

async function deleteAbstract(id){
  if(!confirm("등록된 초록집을 삭제할까요? 이 작업은 되돌릴 수 없습니다.")) return;
  const statusEl = document.getElementById(`status-${id}`);
  statusEl.className = "status busy";
  statusEl.textContent = "삭제 중...";
  try{
    const { data, error } = await sb.storage.from(BUCKET).remove([abstractPath(id)]);
    if(error) throw error;
    /* RLS가 삭제를 막으면 이 endpoint는 에러 없이 빈 배열을 반환한다 (조용한 실패) */
    if(!data || data.length === 0){
      throw new Error("삭제 권한이 아직 설정되지 않았습니다 (관리자에게 문의)");
    }
    setAbstractUnregistered(id);
    statusEl.className = "status ok";
    statusEl.textContent = "삭제 완료";
    setTimeout(() => { statusEl.textContent = ""; }, 2000);
  }catch(err){
    console.error(err);
    statusEl.className = "status err";
    statusEl.textContent = "삭제 실패: " + (err.message || err);
  }
}

/* 이미지를 최대 800px, JPEG(품질 0.85)로 축소/변환 */
function resizeToJpeg(file, maxSize, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("파일을 읽을 수 없습니다"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("이미지 파일이 아닙니다"));
      img.onload = () => {
        let { width, height } = img;
        if(width > height && width > maxSize){
          height = Math.round(height * (maxSize / width));
          width = maxSize;
        }else if(height > maxSize){
          width = Math.round(width * (maxSize / height));
          height = maxSize;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0,0,width,height);
        ctx.drawImage(img, 0, 0, width, height);
        canvas.toBlob(b => {
          if(!b) return reject(new Error("이미지 변환 실패"));
          resolve(b);
        }, "image/jpeg", quality);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

document.getElementById("refreshBtn").addEventListener("click", renderCards);

/* ====================== 전체 다운로드 (비밀번호) ====================== */
const pwModal = document.getElementById("pwModal");
const pwInput = document.getElementById("pwInput");
const pwError = document.getElementById("pwError");

let pendingDownload = null;

function askPassword(fn){
  pendingDownload = fn;
  pwInput.value = "";
  pwError.textContent = "";
  pwModal.classList.add("show");
  pwInput.focus();
}

document.getElementById("downloadAllBtn").addEventListener("click", () => {
  askPassword(downloadAllPhotos);
});
document.getElementById("downloadAbstractsBtn").addEventListener("click", () => {
  askPassword(downloadAllAbstracts);
});
document.getElementById("pwCancel").addEventListener("click", () => {
  pwModal.classList.remove("show");
});
pwInput.addEventListener("keydown", (e) => { if(e.key === "Enter") document.getElementById("pwOk").click(); });

document.getElementById("pwOk").addEventListener("click", async () => {
  let hash;
  try{
    hash = await sha256(pwInput.value);
  }catch(err){
    console.error(err);
    pwError.textContent = "이 브라우저/환경에서는 비밀번호 확인을 사용할 수 없습니다 (https 주소에서 이용해 주세요).";
    return;
  }
  if(hash !== DOWNLOAD_PW_HASH){
    pwError.textContent = "비밀번호가 올바르지 않습니다.";
    return;
  }
  pwModal.classList.remove("show");
  const fn = pendingDownload;
  pendingDownload = null;
  if(fn) await fn();
});

async function sha256(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}

async function downloadAllPhotos(){
  const btn = document.getElementById("downloadAllBtn");
  const original = btn.textContent;
  btn.textContent = "다운로드 준비 중...";
  btn.disabled = true;
  try{
    const zip = new JSZip();
    let count = 0;
    for(const sp of SPEAKERS){
      const url = publicUrl(sp.id, Date.now());
      try{
        const res = await fetch(url, { cache: "no-store" });
        if(!res.ok) continue;
        const blob = await res.blob();
        zip.file(`${sp.id}_${sp.name}.jpg`, blob);
        count++;
      }catch(_){ /* 사진 없는 연자는 건너뜀 */ }
    }
    if(count === 0){
      alert("등록된 사진이 아직 없습니다.");
      return;
    }
    await saveZip(zip, "연자사진_전체.zip");
  }catch(err){
    console.error(err);
    alert("다운로드 중 오류가 발생했습니다: " + (err.message || err));
  }finally{
    btn.textContent = original;
    btn.disabled = false;
  }
}

async function downloadAllAbstracts(){
  const btn = document.getElementById("downloadAbstractsBtn");
  const original = btn.textContent;
  btn.textContent = "다운로드 준비 중...";
  btn.disabled = true;
  try{
    const amap = await fetchAbstractMap();
    const zip = new JSZip();
    let count = 0;
    for(const sp of SPEAKERS){
      const entry = amap[sp.id];
      if(!entry) continue;
      try{
        const res = await fetch(abstractUrl(sp.id, Date.now()), { cache: "no-store" });
        if(!res.ok) continue;
        zip.file(`${sp.id}_${sp.name}.${entry.ext}`, await res.blob());
        count++;
      }catch(_){ /* 실패한 항목은 건너뜀 */ }
    }
    if(count === 0){
      alert("등록된 초록집이 아직 없습니다.");
      return;
    }
    await saveZip(zip, "연자초록집_전체.zip");
  }catch(err){
    console.error(err);
    alert("다운로드 중 오류가 발생했습니다: " + (err.message || err));
  }finally{
    btn.textContent = original;
    btn.disabled = false;
  }
}

async function saveZip(zip, filename){
  const content = await zip.generateAsync({ type: "blob" });
  const url = URL.createObjectURL(content);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}
